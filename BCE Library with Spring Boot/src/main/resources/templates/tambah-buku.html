<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - Perpustakaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #172554;
            --accent-btn: #0284c7;
            --accent-btn-hover: #0369a1;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-accent));
            color: white;
            padding: 26px 32px;
            border-bottom: 4px solid var(--accent-btn);
        }
        .header h1 { font-size: 1.45rem; font-weight: 700; }
        .content { padding: 30px 32px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 7px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent-btn); }
        .btn-submit {
            width: 100%;
            background-color: var(--accent-btn);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:hover { background-color: var(--accent-btn-hover); }
        .footer-nav { margin-top: 18px; text-align: center; }
        .nav-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Tambah Buku Baru</h1>
    </div>
    <div class="content">
        <form th:action="@{/buku}" method="post">
            <div class="form-group">
                <label for="idBuku">ID Buku</label>
                <input type="text" id="idBuku" name="idBuku" class="form-control" placeholder="Contoh: B005" required />
            </div>
            <div class="form-group">
                <label for="judul">Judul Buku</label>
                <input type="text" id="judul" name="judul" class="form-control" placeholder="Masukkan judul buku..." required />
            </div>
            <div class="form-group">
                <label for="stok">Jumlah Stok</label>
                <input type="number" id="stok" name="stok" class="form-control" placeholder="0" min="0" required />
            </div>
            <button type="submit" class="btn-submit">Simpan Buku</button>
        </form>
        <div class="footer-nav">
            <a href="/buku" class="nav-link">&larr; Batal &amp; Kembali ke Daftar Buku</a>
        </div>
    </div>
</div>
</body>
</html>
