<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinjam Buku - Perpustakaan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #172554;
            --accent-btn: #0284c7;
            --accent-btn-hover: #0369a1;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-accent));
            color: white;
            padding: 26px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent-btn);
        }
        .header h1 { font-size: 1.45rem; font-weight: 700; }
        .user-badge {
            background: rgba(255, 255, 255, 0.16);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .user-badge span { color: #38bdf8; font-weight: 700; }
        .content { padding: 30px 32px; }
        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.92rem;
            border-left: 4px solid var(--danger-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alert-error a {
            color: var(--danger-text);
            font-weight: 700;
            text-decoration: underline;
        }
        .table-container {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 22px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }
        td { padding: 15px 18px; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        .badge-stok {
            display: inline-block;
            padding: 4px 11px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .stok-ada { background-color: var(--success-bg); color: var(--success-text); }
        .stok-habis { background-color: var(--danger-bg); color: var(--danger-text); }
        .btn-pinjam {
            background-color: var(--accent-btn);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .btn-pinjam:hover { background-color: var(--accent-btn-hover); }
        .footer-action { display: flex; justify-content: flex-end; }
        .btn-secondary {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Pinjam Buku</h1>
        <div class="user-badge">
            Anggota: <span th:text="${idAnggota}">A001</span>
        </div>
    </div>
    <div class="content">
        <!-- Alur alternatif [14]: pesan gagal + opsi reservasi -->
        <div th:if="${pesan}" class="alert-error">
            <span th:text="${pesan}">Pesan Error</span>
            <a th:if="${bisaReservasi}" href="#">Ajukan Reservasi</a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Judul Buku</th>
                        <th style="width: 120px; text-align: center;">Stok</th>
                        <th style="width: 120px; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="buku : ${daftarBuku}">
                        <td style="font-weight: 600;" th:text="${buku.judul}">Judul Buku</td>
                        <td style="text-align: center;">
                            <span th:text="${buku.stok}"
                                  th:class="${buku.stok > 0} ? 'badge-stok stok-ada' : 'badge-stok stok-habis'">0</span>
                        </td>
                        <td style="text-align: center;">
                            <form th:action="@{/pinjam}" method="post">
                                <input type="hidden" name="idBuku" th:value="${buku.idBuku}" />
                                <button type="submit" class="btn-pinjam">Pinjam</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="footer-action">
            <a href="/buku" class="btn-secondary">Lihat Katalog Buku &rarr;</a>
        </div>
    </div>
</div>
</body>
</html>
